<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="v-sky" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0b1a"/>
      <stop offset="1" stop-color="#221d47"/>
    </linearGradient>
    <linearGradient id="v-ground" x1="0" y1="500" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090812"/>
      <stop offset="1" stop-color="#06050c"/>
    </linearGradient>
    <radialGradient id="v-limb" cx="512" cy="500" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1edff"/>
      <stop offset="0.38" stop-color="#a596ff"/>
      <stop offset="0.82" stop-color="#5d7dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5d7dff" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="v-atmo" cx="512" cy="510" r="520" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 510) scale(1 0.42) translate(0 -510)">
      <stop offset="0" stop-color="#8f7dff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#6b72ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6b72ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v-halo" cx="700" cy="296" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9bdff" stop-opacity="0.62"/>
      <stop offset="0.22" stop-color="#c9bdff" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#c9bdff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c9bdff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v-edge" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="v-clip"><rect width="1024" height="1024" rx="232" ry="232"/></clipPath>
    <mask id="v-limbmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <circle cx="512" cy="1560" r="1060" fill="#fff"/>
      <circle cx="512" cy="4323.70" r="3673.70" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#v-clip)">
    <rect width="1024" height="1024" fill="url(#v-sky)"/>
    
    <circle cx="512" cy="1560" r="1060" fill="url(#v-ground)"/>
    <rect width="1024" height="1024" fill="url(#v-limb)" mask="url(#v-limbmask)"/>
    
    <circle cx="700" cy="296" r="96" fill="#f7f5ff"/>
  </g>
  
