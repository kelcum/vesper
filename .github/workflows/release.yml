name: Release

# Builds the signed installer, a portable zip, the updater manifest and
# checksums, then creates a *draft* GitHub release for review.
# Publishing to xan.gripe/vesper is a separate, manual step
# (scripts/site/publish.mjs), so nothing goes public automatically.
#
# Repository secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Repository variable (optional): VESPER_DISCORD_CLIENT_ID

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VESPER_DISCORD_CLIENT_ID: ${{ vars.VESPER_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check versions match the tag
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($pkg -ne $conf -or $pkg -ne $cargo) { throw "Versions differ: package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo" }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$pkg" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match version $pkg" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is not set; updates can't be signed" }
          node scripts/release/notes.mjs $pkg | Out-Null
          "version=$pkg" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Collect release files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release, portable | Out-Null
          $setup = "src-tauri/target/release/bundle/nsis/Vesper_${v}_x64-setup.exe"
          Copy-Item $setup, "$setup.sig" release/
          Copy-Item src-tauri/target/release/Vesper.exe portable/
          Copy-Item LICENSE portable/LICENSE.txt
          New-Item -ItemType File portable/portable | Out-Null
          Compress-Archive -Path portable/* -DestinationPath "release/Vesper_${v}_x64-portable.zip"
          node scripts/release/manifest.mjs $v "release/Vesper_${v}_x64-setup.exe" release/latest.json
          node scripts/release/checksums.mjs release
          node scripts/release/notes.mjs $v > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" --draft --title "Vesper $v" --notes-file release-notes.md (Get-ChildItem release/* | ForEach-Object FullName)

      - uses: actions/upload-artifact@v4
        with:
          name: vesper-${{ steps.version.outputs.version }}
          path: release/
