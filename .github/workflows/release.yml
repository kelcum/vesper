name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  VESPER_DISCORD_CLIENT_ID: ${{ vars.VESPER_DISCORD_CLIENT_ID }}

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check versions match the tag
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "Versions differ: package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"; exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "v$pkg" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} doesn't match version $pkg"; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; updates can't be signed"; exit 1
          fi
          node scripts/release/notes.mjs "$pkg" > /dev/null
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Collect release files
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force release, portable | Out-Null
          $setup = "src-tauri/target/release/bundle/nsis/Vesper_${v}_x64-setup.exe"
          Copy-Item $setup, "$setup.sig" release/
          Copy-Item src-tauri/target/release/Vesper.exe portable/
          Copy-Item LICENSE portable/LICENSE.txt
          New-Item -ItemType File portable/portable | Out-Null
          Compress-Archive -Path portable/* -DestinationPath "release/Vesper_${v}_x64-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/

  macos:
    name: macOS build
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Collect release files
        run: |
          v="${{ needs.version.outputs.version }}"
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p release
          cp "$bundle/dmg/Vesper_${v}_universal.dmg" release/
          cp "$bundle/macos/Vesper.app.tar.gz" "release/Vesper_${v}_universal.app.tar.gz"
          cp "$bundle/macos/Vesper.app.tar.gz.sig" "release/Vesper_${v}_universal.app.tar.gz.sig"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/

  release:
    name: Draft release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Write manifest, checksums and notes
        run: |
          v="${{ needs.version.outputs.version }}"
          node scripts/release/manifest.mjs "$v" "release/Vesper_${v}_x64-setup.exe" release/latest.json \
            --mac "release/Vesper_${v}_universal.app.tar.gz"
          node scripts/release/checksums.mjs release
          node scripts/release/notes.mjs "$v" > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          gh release create "v$v" --draft --title "Vesper $v" --notes-file release-notes.md release/*

      - uses: actions/upload-artifact@v7
        with:
          name: vesper-${{ needs.version.outputs.version }}
          path: release/
